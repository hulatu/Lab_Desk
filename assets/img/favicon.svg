<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="LabDesk 科研数据台">
  <!-- 背景用纯色而非渐变：生成 PNG/ICO 时用的内部 SVG 渲染器不支持渐变引用，
       会渲染成黑块。16px 下渐变也几乎看不出，纯色更清晰。 -->
  <rect width="64" height="64" rx="14" fill="#0f766e"/>
  <!-- 三根高度递增的柱子。宽 10 / 间距 4：缩到 16px 时每根仍有 2~3 个像素，
       不会糊成一块白斑（宽 8 时 16px 只剩 2px，容易糊）。 -->
  <g fill="#ffffff">
    <rect x="13" y="38" width="10" height="12" rx="2"/>
    <rect x="27" y="29" width="10" height="21" rx="2"/>
    <rect x="41" y="20" width="10" height="30" rx="2"/>
  </g>
  <!-- 基线 -->
  <rect x="13" y="51" width="38" height="3" rx="1.5" fill="#ffffff" opacity="0.7"/>
</svg>
